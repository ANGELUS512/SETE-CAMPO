<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>SETE Campo — Registro de Inspección</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SETE Campo">
<meta name="theme-color" content="#12161a">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#12161a; --surface:#1a2027; --surface2:#212830;
    --border:#2c353e; --border-soft:#232b32;
    --text:#e6eaee; --text-dim:#8b98a5;
    --accent:#e8a33d; --accent-soft:#3a2f1c;
    --accent2:#3f9d94; --accent2-soft:#16302d;
    --danger:#d9634f; --radius:5px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--bg),var(--bg)),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 24px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 24px);
    color:var(--text); font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:14px 14px 60px;}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .app-icon{width:38px;height:38px;border-radius:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.4);}
  .brand-text h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:16.5px;letter-spacing:.01em;margin:0;color:var(--text);line-height:1.15;}
  .brand-text .sub{font-size:10.5px;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;}
  .counter{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);text-align:right;}
  .counter b{color:var(--accent);font-size:14px;}

  .linea-bar{
    background:var(--surface); border:1px solid var(--accent2); border-left-width:4px;
    border-radius:8px; padding:10px 12px; margin-bottom:14px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .linea-bar .lbl{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;color:var(--accent2);font-weight:600;white-space:nowrap;}
  .linea-bar input{
    flex:1; min-width:160px; background:transparent; border:none; color:var(--text);
    font-family:'IBM Plex Mono',monospace; font-size:14.5px; font-weight:600; padding:4px 2px; outline:none;
  }

  nav.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;}
  nav.tabs button{flex:1;border:none;background:transparent;color:var(--text-dim);font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.03em;font-size:13.5px;padding:10px 8px;border-radius:6px;cursor:pointer;transition:background .15s,color .15s;}
  nav.tabs button.active{background:var(--accent2);color:#0d1417;}

  .panel{display:none;}
  .panel.active{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
  .card h2{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 12px;}

  .row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .field{flex:1;min-width:110px;display:flex;flex-direction:column;gap:5px;}
  .field.small{max-width:110px;}
  label{font-size:11.5px;color:var(--text-dim);font-weight:600;letter-spacing:.02em;}
  input[type=text],input[type=number],select,textarea{
    background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:11px 10px;font-size:15px;font-family:'IBM Plex Mono',monospace;width:100%;
  }
  select{font-family:'Inter',sans-serif;font-size:14px;}
  textarea{font-family:'Inter',sans-serif;font-size:14px;resize:vertical;min-height:56px;}
  input#codigo{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.03em;font-size:17px;text-transform:uppercase;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(63,157,148,.18);}

  .lect-head{display:grid;grid-template-columns:26px 68px 1fr;gap:6px;margin-bottom:6px;}
  .lect-head span{font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;text-align:center;}
  .lect-head .sub-labels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .lect-row{display:grid;grid-template-columns:26px 68px 1fr;gap:6px;align-items:center;margin-bottom:6px;}
  .fila-label{font-size:10px;color:var(--text-dim);text-align:right;padding-right:2px;}
  .nominal-input{
    text-align:center;padding:10px 4px;font-size:13px;
    border-color:var(--accent2)!important;background:var(--accent2-soft)!important;
    -moz-appearance:textfield;
  }
  .nominal-input::-webkit-outer-spin-button,
  .nominal-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .lecturas-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .lecturas-grid input{text-align:center;padding:10px 4px;font-size:14px;}

  .toggle-row{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:13px;color:var(--text-dim);}
  .toggle-row input{width:16px;height:16px;accent-color:var(--accent2);}

  .btn{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.03em;font-size:14.5px;border:none;border-radius:7px;padding:13px 16px;cursor:pointer;transition:filter .12s, transform .05s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent);color:#241a08;width:100%;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-accent2{background:var(--accent2);color:#08201c;border:1px solid var(--accent2);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(217,99,79,.4);font-size:12.5px;padding:6px 10px;}
  .btn-small{font-size:12.5px;padding:7px 10px;}

  .umbral-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px;flex-wrap:wrap;}
  .umbral-bar label{white-space:nowrap;}
  .umbral-bar input{width:90px;}
  .umbral-bar .hint{font-size:11px;color:var(--text-dim);margin-left:auto;}

  .export-row{display:flex;gap:8px;margin-bottom:10px;}
  .export-row .btn{flex:1;}

  .table-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
  table.reg{width:100%;border-collapse:collapse;background:var(--surface);min-width:780px;}
  table.reg th{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);background:var(--surface2);padding:8px 6px;border:1px solid var(--border-soft);text-align:center;white-space:nowrap;}
  table.reg td{border:1px solid var(--border-soft);padding:7px 6px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  td.meta{font-family:'Inter',sans-serif;background:var(--surface2);}
  td.linea-cell{font-family:'Inter',sans-serif;background:var(--surface2);color:var(--accent2);font-weight:600;font-size:11.5px;max-width:110px;}
  td.codigo-cell{font-family:'Oswald',sans-serif;font-weight:700;font-size:14px;color:var(--accent);letter-spacing:.02em;}
  td.nominal-cell{color:var(--accent2);font-weight:600;}
  td.obs-cell{font-family:'Inter',sans-serif;text-align:left;font-size:11.5px;color:var(--text-dim);max-width:160px;}
  tr.divider td{background:#0c0f12;padding:3px;border:none;}
  tr.actions-row td{background:var(--surface2);text-align:left;padding:6px 8px;}
  td.below{background:var(--accent-soft);color:var(--accent);font-weight:600;}

  .empty{text-align:center;color:var(--text-dim);padding:40px 16px;font-size:14px;}
  .empty .big{font-family:'Oswald',sans-serif;font-size:15px;color:var(--text);margin-bottom:4px;}

  .search-bar{margin-bottom:12px;}
  .search-bar input{font-family:'Inter',sans-serif;}
  .install-hint{font-size:11px;color:var(--text-dim);text-align:center;margin:10px 0 0;line-height:1.5;}
  ::placeholder{color:#556270;}

  @media (max-width:480px){
    h1{font-size:16.5px;}
    .lecturas-grid input{font-size:13px;padding:9px 2px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <svg class="app-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="20" fill="#12161a"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="#e8a33d" stroke-width="7"/>
        <path d="M22 52c8-14 16 14 24 0s16-14 24 0s8 14 8 14" fill="none" stroke="#3f9d94" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand-text">
        <h1>SETE Campo</h1>
        <div class="sub">Registro de Inspección</div>
      </div>
    </div>
    <div class="counter">Puntos<br><b id="countDisplay">0</b></div>
  </header>

  <div class="linea-bar">
    <span class="lbl">LÍNEA / TRAMO</span>
    <input type="text" id="lineaActual" placeholder='Ej: PW 2" - MDC CPF CAMPO' autocomplete="off">
  </div>

  <nav class="tabs">
    <button class="active" data-tab="ingreso">+ Nuevo Punto</button>
    <button data-tab="tabla">Tabla / Registro</button>
  </nav>

  <!-- ===== PANEL INGRESO ===== -->
  <div class="panel active" id="panel-ingreso">
    <div class="card">
      <h2>Datos del punto</h2>
      <div class="row">
        <div class="field small">
          <label for="codigo">Código</label>
          <input type="text" id="codigo" placeholder="1E" autocomplete="off">
        </div>
        <div class="field">
          <label for="tipo">Tipo</label>
          <select id="tipo">
            <option value="TUBO">TUBO</option>
            <option value="CODO">CODO</option>
            <option value="NIPLE">NIPLE</option>
            <option value="REDUCCIÓN">REDUCCIÓN</option>
            <option value="TEE">TEE</option>
            <option value="BRIDA">BRIDA</option>
            <option value="OTRO">OTRO...</option>
          </select>
        </div>
      </div>
      <div class="row" id="otroTipoRow" style="display:none;">
        <div class="field"><label for="tipoOtro">Especificar tipo</label><input type="text" id="tipoOtro" placeholder="Ej: SOPORTE"></div>
      </div>
      <div class="row">
        <div class="field small"><label for="diametro">Diámetro (pulg)</label><input type="text" id="diametro" placeholder="2" autocomplete="off"></div>
        <div class="field small"><label for="longitud">Longitud (m)</label><input type="number" id="longitud" placeholder="0.20" step="0.01" inputmode="decimal"></div>
      </div>
    </div>

    <div class="card">
      <h2>Lecturas de espesor (mm)</h2>
      <div class="lect-head">
        <span></span><span>Nom.</span>
        <div class="sub-labels"><span>A</span><span>B</span><span>C</span><span>D</span></div>
      </div>
      <div class="lect-row" data-fila="0">
        <div class="fila-label">F1</div>
        <input type="number" class="nominal-input" step="0.001" inputmode="decimal" placeholder="—">
        <div class="lecturas-grid">
          <input type="number" step="0.001" inputmode="decimal" placeholder="0.000">
          <input type="number" step="0.001" inputmode="decimal" placeholder="0.000">
          <input type="number" step="0.001" inputmode="decimal" placeholder="0.000">
          <input type="number" step="0.001" inputmode="decimal" placeholder="0.000">
        </div>
      </div>
      <div class="lect-row" data-fila="1">
        <div class="fila-label">F2</div>
        <input type="number" class="nominal-input" step="0.001" inputmode="decimal" placeholder="—">
        <div class="lecturas-grid">
          <input type="number" step="0.001" inputmode="decimal" placeholder="0.000">
          <input type="number" step="0.001" inputmode="decimal" placeholder="0.000">
          <input type="number" step="0.001" inputmode="decimal" placeholder="0.000">
          <input type="number" step="0.001" inputmode="decimal" placeholder="0.000">
        </div>
      </div>
      <div class="lect-row" data-fila="2">
        <div class="fila-label">F3</div>
        <input type="number" class="nominal-input" step="0.001" inputmode="decimal" placeholder="—">
        <div class="lecturas-grid">
          <input type="number" step="0.001" inputmode="decimal" placeholder="0.000">
          <input type="number" step="0.001" inputmode="decimal" placeholder="0.000">
          <input type="number" step="0.001" inputmode="decimal" placeholder="0.000">
          <input type="number" step="0.001" inputmode="decimal" placeholder="0.000">
        </div>
      </div>

      <label class="toggle-row"><input type="checkbox" id="mantenerTipo"> Mantener tipo / diámetro / longitud para el siguiente punto</label>
    </div>

    <div class="card">
      <h2>Observaciones</h2>
      <textarea id="observaciones" placeholder="Ej: línea se entierra, llega a válvula de bola, cruce vía, cambio de recubrimiento..."></textarea>
    </div>

    <button class="btn btn-primary" id="btnAgregar">Agregar punto ↵</button>
    <div class="install-hint">Tip: desde el navegador del celular usa "Agregar a pantalla de inicio" para abrir esto como app.</div>
  </div>

  <!-- ===== PANEL TABLA ===== -->
  <div class="panel" id="panel-tabla">
    <div class="umbral-bar">
      <label for="umbral">Umbral (mm):</label>
      <input type="number" id="umbral" step="0.001" placeholder="ej: 0.200" inputmode="decimal">
      <span class="hint">Resalta lecturas ≤ umbral</span>
    </div>
    <div class="search-bar"><input type="text" id="buscar" placeholder="Buscar código o línea... (ej: 1T, PW 2)" style="width:100%;"></div>
    <div class="export-row">
      <button class="btn btn-accent2" id="btnCompartir">📤 Compartir Excel</button>
      <button class="btn btn-ghost" id="btnExportXLSX">Descargar .xlsx</button>
    </div>
    <div class="export-row">
      <button class="btn btn-ghost" id="btnExportCSV">CSV (;)</button>
      <button class="btn btn-ghost" id="btnLimpiar">Borrar todo</button>
    </div>
    <div id="tablaWrap"></div>
  </div>

</div>

<script>
const STORAGE_KEY = 'puntos_inspeccion_v2';
const LINEA_KEY = 'linea_actual_v1';
let puntos = [];
let editId = null;

const $ = s => document.querySelector(s);
const tipoSel = $('#tipo'), otroRow = $('#otroTipoRow'), tipoOtro = $('#tipoOtro');

const DOBLE_DIAMETRO = ['TEE','REDUCCIÓN'];
tipoSel.addEventListener('change', () => {
  otroRow.style.display = tipoSel.value === 'OTRO' ? 'flex' : 'none';
  $('#diametro').placeholder = DOBLE_DIAMETRO.includes(tipoSel.value) ? '2x3' : '2';
});

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    $('#panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='tabla') renderTabla();
  });
});

async function loadPuntos(){
  try{ const res = await window.storage.get(STORAGE_KEY); puntos = res ? JSON.parse(res.value) : []; }
  catch(e){ puntos = []; }
  // migración de formato antiguo (filas = arrays planos) a {nominal, valores}
  puntos.forEach(p=>{
    if(Array.isArray(p.lecturas)){
      p.lecturas = p.lecturas.map(f => Array.isArray(f) ? {nominal:null, valores:f} : f);
    }
    if(p.linea === undefined) p.linea = '';
    if(p.observaciones === undefined) p.observaciones = '';
  });
  updateCount();
}
async function savePuntos(){ try{ await window.storage.set(STORAGE_KEY, JSON.stringify(puntos)); }catch(e){ console.error('No se pudo guardar', e); } }
async function loadLinea(){ try{ const res = await window.storage.get(LINEA_KEY); if(res) $('#lineaActual').value = res.value; }catch(e){} }
async function saveLinea(){ try{ await window.storage.set(LINEA_KEY, $('#lineaActual').value.trim()); }catch(e){} }
$('#lineaActual').addEventListener('change', saveLinea);
$('#lineaActual').addEventListener('blur', saveLinea);

function updateCount(){ $('#countDisplay').textContent = puntos.length; }

function getLecturas(){
  const filas = [];
  document.querySelectorAll('.lect-row').forEach(row=>{
    const nomVal = row.querySelector('.nominal-input').value;
    const nominal = nomVal === '' ? null : parseFloat(nomVal);
    const valores = Array.from(row.querySelectorAll('.lecturas-grid input')).map(i => i.value === '' ? null : parseFloat(i.value));
    filas.push({nominal, valores});
  });
  return filas;
}
function setLecturas(filas){
  document.querySelectorAll('.lect-row').forEach((row, fi)=>{
    const f = (filas && filas[fi]) ? filas[fi] : {nominal:null, valores:[]};
    row.querySelector('.nominal-input').value = (f.nominal===null||f.nominal===undefined) ? '' : f.nominal;
    row.querySelectorAll('.lecturas-grid input').forEach((inp,ci)=>{
      const v = f.valores ? f.valores[ci] : null;
      inp.value = (v===null||v===undefined) ? '' : v;
    });
  });
}
function clearLecturas(){ document.querySelectorAll('.lect-row input').forEach(i=>i.value=''); }

function resetForm(keepMeta){
  $('#codigo').value=''; $('#observaciones').value='';
  if(!keepMeta){ tipoSel.value='TUBO'; otroRow.style.display='none'; tipoOtro.value=''; $('#diametro').placeholder='2'; $('#diametro').value=''; $('#longitud').value=''; }
  clearLecturas();
  $('#codigo').focus();
  editId = null;
  $('#btnAgregar').textContent = 'Agregar punto ↵';
}

$('#btnAgregar').addEventListener('click', async ()=>{
  const codigo = $('#codigo').value.trim().toUpperCase();
  if(!codigo){ $('#codigo').focus(); return; }
  const tipo = tipoSel.value === 'OTRO' ? (tipoOtro.value.trim().toUpperCase() || 'OTRO') : tipoSel.value;
  const diametro = $('#diametro').value;
  const longitud = $('#longitud').value;
  const linea = $('#lineaActual').value.trim();
  const observaciones = $('#observaciones').value.trim();
  const lecturas = getLecturas();

  if(editId){
    const idx = puntos.findIndex(p=>p.id===editId);
    if(idx>-1) puntos[idx] = {...puntos[idx], codigo, tipo, diametro, longitud, linea, observaciones, lecturas};
  } else {
    puntos.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), codigo, tipo, diametro, longitud, linea, observaciones, lecturas });
  }
  await savePuntos(); await saveLinea(); updateCount();
  const keep = $('#mantenerTipo').checked;
  resetForm(keep);
});

$('#codigo').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); document.querySelector('.nominal-input').focus(); }});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && (e.target.matches('.lecturas-grid input') || e.target.matches('.nominal-input'))){
    e.preventDefault();
    const inputs = Array.from(document.querySelectorAll('.lect-row input'));
    const idx = inputs.indexOf(e.target);
    if(idx > -1 && idx < inputs.length-1) inputs[idx+1].focus();
    else $('#observaciones').focus();
  }
});

function editPunto(id){
  const p = puntos.find(x=>x.id===id);
  if(!p) return;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(pn=>pn.classList.remove('active'));
  document.querySelector('nav.tabs button[data-tab="ingreso"]').classList.add('active');
  $('#panel-ingreso').classList.add('active');

  $('#codigo').value = p.codigo;
  const knownTipos = ['TUBO','CODO','NIPLE','REDUCCIÓN','TEE','BRIDA'];
  if(knownTipos.includes(p.tipo)){ tipoSel.value = p.tipo; otroRow.style.display='none'; }
  else { tipoSel.value='OTRO'; otroRow.style.display='flex'; tipoOtro.value = p.tipo; }
  $('#diametro').placeholder = DOBLE_DIAMETRO.includes(tipoSel.value) ? '2x3' : '2';
  $('#diametro').value = p.diametro || '';
  $('#longitud').value = p.longitud || '';
  $('#observaciones').value = p.observaciones || '';
  if(p.linea) $('#lineaActual').value = p.linea;
  setLecturas(p.lecturas);
  editId = id;
  $('#btnAgregar').textContent = 'Guardar cambios ✓';
  $('#codigo').focus();
}

async function deletePunto(id){ puntos = puntos.filter(p=>p.id!==id); await savePuntos(); updateCount(); renderTabla(); }

$('#umbral').addEventListener('input', renderTabla);
$('#buscar').addEventListener('input', renderTabla);

function renderTabla(){
  const wrap = $('#tablaWrap');
  const umbral = parseFloat($('#umbral').value);
  const filtro = $('#buscar').value.trim().toUpperCase();
  let lista = puntos;
  if(filtro) lista = lista.filter(p=> p.codigo.includes(filtro) || (p.linea||'').toUpperCase().includes(filtro));

  if(lista.length===0){
    wrap.innerHTML = `<div class="empty"><div class="big">Sin puntos registrados</div>${filtro? 'No hay coincidencias para "'+filtro+'".' : 'Agrega tu primer punto desde la pestaña "+ Nuevo Punto".'}</div>`;
    return;
  }

  let html = `<div class="table-scroll"><table class="reg"><thead><tr>
    <th style="width:90px;">Línea</th><th style="width:55px;">Código</th><th style="width:65px;">Tipo</th><th style="width:40px;">Ø</th><th style="width:50px;">Long.</th>
    <th style="width:50px;">Nom.</th><th>A</th><th>B</th><th>C</th><th>D</th><th style="width:140px;">Observaciones</th>
  </tr></thead><tbody>`;

  lista.forEach((p, i)=>{
    const filas = (p.lecturas && p.lecturas.length) ? p.lecturas : [{nominal:null,valores:[]}];
    filas.forEach((fila, fi)=>{
      html += '<tr>';
      if(fi===0){
        html += `<td class="linea-cell" rowspan="${filas.length}">${esc(p.linea||'—')}</td>
                  <td class="codigo-cell" rowspan="${filas.length}">${esc(p.codigo)}</td>
                  <td class="meta" rowspan="${filas.length}">${esc(p.tipo)}</td>
                  <td class="meta" rowspan="${filas.length}">${p.diametro||'—'}</td>
                  <td class="meta" rowspan="${filas.length}">${p.longitud||'—'}</td>`;
      }
      const nom = fila.nominal;
      html += `<td class="nominal-cell">${(nom===null||nom===undefined)?'—':Number(nom).toFixed(3)}</td>`;
      for(let c=0;c<4;c++){
        const v = fila.valores ? fila.valores[c] : null;
        const isBelow = (!isNaN(umbral) && v!==null && v!==undefined && v<=umbral);
        html += `<td class="${isBelow?'below':''}">${v===null||v===undefined?'—':Number(v).toFixed(3)}</td>`;
      }
      if(fi===0) html += `<td class="obs-cell" rowspan="${filas.length}">${esc(p.observaciones||'—')}</td>`;
      html += '</tr>';
    });
    html += `<tr class="actions-row"><td colspan="11">
        <button class="btn btn-ghost btn-small" onclick="editPunto('${p.id}')">✎ Editar</button>
        <button class="btn btn-danger" onclick="if(confirm('¿Eliminar punto ${esc(p.codigo)}?'))deletePunto('${p.id}')" style="margin-left:6px;">✕ Eliminar</button>
      </td></tr>`;
    if(i < lista.length-1) html += `<tr class="divider"><td colspan="11"></td></tr>`;
  });

  html += '</tbody></table></div>';
  wrap.innerHTML = html;
}

function esc(s){ return String(s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function buildRowsFlat(){
  const rows = [];
  puntos.forEach(p=>{
    const filas = (p.lecturas && p.lecturas.length) ? p.lecturas : [{nominal:null,valores:[]}];
    filas.forEach(fila=>{
      const vals = [0,1,2,3].map(c=> (fila.valores && fila.valores[c]!==null && fila.valores[c]!==undefined) ? fila.valores[c] : '');
      rows.push([p.linea||'', p.codigo, p.tipo, p.diametro||'', p.longitud||'', (fila.nominal===null||fila.nominal===undefined)?'':fila.nominal, ...vals, p.observaciones||'']);
    });
  });
  return rows;
}

function buildSheetData(){
  const header = ['Linea','Codigo','Tipo','Diametro','Longitud','Nominal','A','B','C','D','Observaciones'];
  const rows = [header];
  const merges = [];
  let r = 1;
  puntos.forEach(p=>{
    const filas = (p.lecturas && p.lecturas.length) ? p.lecturas : [{nominal:null,valores:[]}];
    filas.forEach((fila, fi)=>{
      const vals = [0,1,2,3].map(c=> (fila.valores && fila.valores[c]!==null && fila.valores[c]!==undefined) ? fila.valores[c] : '');
      rows.push([
        fi===0?(p.linea||''):'', fi===0?p.codigo:'', fi===0?p.tipo:'', fi===0?(p.diametro||''):'', fi===0?(p.longitud||''):'',
        (fila.nominal===null||fila.nominal===undefined)?'':fila.nominal, ...vals,
        fi===0?(p.observaciones||''):''
      ]);
    });
    if(filas.length > 1){
      [0,1,2,3,4,10].forEach(col=> merges.push({ s:{r:r, c:col}, e:{r:r+filas.length-1, c:col} }));
    }
    r += filas.length;
  });
  return { rows, merges };
}

function buildWorkbook(){
  const { rows, merges } = buildSheetData();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:16},{wch:8},{wch:11},{wch:7},{wch:7},{wch:7},{wch:7},{wch:7},{wch:7},{wch:7},{wch:26}];
  ws['!merges'] = merges;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Registro');
  return wb;
}

$('#btnExportXLSX').addEventListener('click', ()=>{
  if(puntos.length===0){ alert('No hay puntos para exportar.'); return; }
  XLSX.writeFile(buildWorkbook(), 'registro_puntos_' + new Date().toISOString().slice(0,10) + '.xlsx');
});

$('#btnExportCSV').addEventListener('click', ()=>{
  if(puntos.length===0){ alert('No hay puntos para exportar.'); return; }
  let csv = 'Linea;Codigo;Tipo;Diametro;Longitud;Nominal;A;B;C;D;Observaciones\n';
  buildRowsFlat().forEach(r=>{ csv += r.map(v=>String(v).replace(/;/g,',')).join(';') + '\n'; });
  const uri = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  const a = document.createElement('a');
  a.href = uri; a.download = 'registro_puntos_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
});

$('#btnCompartir').addEventListener('click', async ()=>{
  if(puntos.length===0){ alert('No hay puntos para exportar.'); return; }
  const wb = buildWorkbook();
  const arrbuf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const filename = 'registro_puntos_' + new Date().toISOString().slice(0,10) + '.xlsx';
  const file = new File([arrbuf], filename, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({ files:[file], title:'Registro de puntos SETE', text: $('#lineaActual').value || 'Registro de inspección' }); return; }
    catch(e){ /* usuario canceló o falló: caemos a descarga */ }
  }
  XLSX.writeFile(wb, filename);
  alert('Tu navegador no soporta compartir directo — se descargó el archivo, puedes adjuntarlo manualmente desde tu carpeta de Descargas.');
});

$('#btnLimpiar').addEventListener('click', async ()=>{
  if(puntos.length===0) return;
  if(confirm('Esto borrará TODOS los puntos registrados. ¿Continuar?')){
    puntos = []; await savePuntos(); updateCount(); renderTabla();
  }
});

Promise.all([loadPuntos(), loadLinea()]).then(()=>{ $('#codigo').focus(); });

// Registro del service worker (solo funciona cuando la app está alojada en un servidor real, no dentro del chat)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{ /* no disponible en este entorno, no pasa nada */ });
  });
}
</script>
